    - "El artículo nuevo se diferencia de guías existentes al centrarse en bodas por papel, horario, clima y aplicación."
    - "No se prometen duraciones universales ni se afirma experiencia personal."
    - "La imagen destacada es original, editorial y sin marcas reconocibles."
  external_observations:
    - "La SERP ofrece guías y productos, pero pocas páginas desarrollan la moderación por ceremonia, banquete y clima mediterráneo."
  editorial_inferences:
    - "Para bodas de día convienen perfiles más luminosos; para noche hay más margen para ámbar, especias y vainilla, con dosificación."
    - "Comprar por secado y contexto reduce riesgo frente a elegir solo por primer impacto o popularidad."
