claims:
  verified:
    - "El artículo se diferencia de 'perfumes árabes en Calpe' al cubrir compra original en España, online y física, no una ruta local."
    - "Se diferencia de 'cómo elegir un perfume árabe' al priorizar dónde comprar, señales de vendedor y autenticidad, no familias olfativas."
    - "No se inventan precios, stock, reseñas, experiencia propia ni tiendas autorizadas sin fuente pública."
  external_observations:
    - "Los resultados accesibles tratan la autenticidad desde señales comerciales, no desde un registro público universal de distribuidores."
    - "La SERP favorece páginas de tienda y categorías, por lo que el artículo usa matriz de riesgo y checklist en lugar de ranking absoluto."
  editorial_inferences:
    - "La mejor ruta de compra depende de si el lector necesita probar, comparar precio, encontrar una referencia exacta o reducir riesgo de falsificación."
    - "Factura, lote, caja, política de devolución y vendedor identificable son señales más útiles que una promesa de duración o un precio agresivo."
  firsthand_evidence: []
conflicts:
  - "Algunas tiendas usan 'original', 'inspiración' y 'equivalencia' de forma comercial; el artículo exige que el vendedor lo distinga claramente."
  - "El 2026-10-05, Kiwiku, OrientFragance, Fragarabic, Lattafa y Afnan devolvieron bloqueo automatizado 403/429 o similar a curl; se tratan como observaciones de SERP, no como fuentes visibles principales del artículo."
must_not_claim:
  - "No afirmar que una tienda concreta es distribuidor oficial si no hay fuente oficial verificable."
  - "No prometer autenticidad por una sola señal como precinto o lote."
  - "No inventar prueba de compra, stock, precio, devoluciones concretas o reseñas."
  - "No presentar la imagen generada como foto de producto real."
